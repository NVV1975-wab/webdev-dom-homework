<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

<script>
  "use strict";

  const commentsList = document.querySelector(".comments");
  const nameInput = document.querySelector(".add-form-name");
  const commentInput = document.querySelector(".add-form-text");
  const addButton = document.querySelector(".add-form-button");

  let userName = "";
  let commentText = "";

  function updateForm() {
    userName = nameInput.value.trim();
    commentText = commentInput.value.trim();

    addButton.disabled = userName === "" || commentText === "";
  }

  nameInput.addEventListener("input", updateForm);
  commentInput.addEventListener("input", updateForm);
  
  function escapeHtml(text) {
    return text
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  addButton.addEventListener("click", () => {
    updateForm();

    if (userName === "" || commentText === "") {
      return;
    }
    const now = new Date();

    const day = String(now.getDate()).padStart(2, "0");
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const year = String(now.getFullYear()).slice(-2);
    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");

    const dateTime = `${day}.${month}.${year} ${hours}:${minutes}`;

    const safeName = escapeHtml(userName);
    const safeComment = escapeHtml(commentText)
      .replace(/\r?\n/g, "<br>");

    const newComment = `
      <li class="comment">
        <div class="comment-header">
          <div>${safeName}</div>
          <div>${dateTime}</div>
        </div>

        <div class="comment-body">
          <div class="comment-text">
            ${safeComment}
          </div>
        </div>

        <div class="comment-footer">
          <div class="likes">
            <span class="likes-counter">0</span>
            <button
              class="like-button"
              type="button"
              aria-label="Поставить лайк"
            ></button>
          </div>
        </div>
      </li>
    `;

    commentsList.innerHTML += newComment;

    nameInput.value = "";
    commentInput.value = "";
    updateForm();

    nameInput.focus();
  });


  updateForm();
</script>
</html>
